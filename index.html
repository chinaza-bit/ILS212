<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILS212 TEST/QUIZ FOR COVENANT GENERALS</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">

  <div class="drawer-label"><span class="tab">FUTO · ILS 212</span></div>
  <h1 class="title">ILS212 Test/Quiz for Covenant Generals</h1>
  <div class="subtitle">A Card-Catalog Self Test</div>

  <div class="card">
    <div class="card-inner">

      <!-- SETUP -->
      <div id="setup-screen">
        <div class="field-row">
          <span class="field-label">Choose a drawer</span>
          <div class="bank-options" id="bank-options"></div>
          <div class="bank-note" id="bank-note"></div>
        </div>
        <div class="field-row">
          <span class="field-label">Number of cards to draw</span>
          <div class="count-options" id="count-options"></div>
        </div>
        <button class="stamp-btn" id="start-btn">Begin Search</button>
        <div class="deck-note" id="deck-note"></div>
      </div>

      <!-- QUIZ -->
      <div id="quiz-screen" class="hidden">
        <div class="progress-row">
          <span class="qnum" id="qnum-label">Card 1</span>
          <span class="score" id="score-label">Score: 0</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="module-tag" id="module-tag">Module</div>
        <p class="question-text" id="question-text"></p>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <div class="next-row">
          <button class="next-btn" id="next-btn">Next Card →</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="results-screen" class="hidden results">
        <div class="call-number">CALL NO. RESULT / SESSION</div>
        <div class="big-score" id="final-score">0 / 0</div>
        <div class="score-sub" id="final-pct">0% correct</div>
        <div class="rating" id="rating-text"></div>
        <div class="results-actions">
          <button class="btn-primary" id="review-btn">Review Answers</button>
          <button class="btn-ghost" id="retry-btn">New Search</button>
        </div>
        <div class="review-list hidden" id="review-list"></div>
      </div>

    </div>
  </div>

  <footer class="credit">Drawn from FUTO ILS 212 course notes · Modules 1–5</footer>
</div>

<script src="questions.js"></script>
<script src="pastQuestions.js"></script>
<script src="script.js"></script>
</body>
</html>
